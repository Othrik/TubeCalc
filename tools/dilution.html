<main class="container">
  <h1 class="page-title">溶液稀释计算</h1>
  <p class="page-desc">基于 C1V1 = C2V2。四个量中留空你想求解的那一个（只留一个空），其余三项填入数字。单位自行保持一致即可（如 C 用 mM、V 用 mL）。</p>

  <div class="panel">
    <div class="row">
      <div>
        <label for="c1">C1（原液浓度）</label>
        <input type="number" id="c1" step="any" placeholder="如 1000">
      </div>
      <div>
        <label for="v1">V1（所需原液体积）</label>
        <input type="number" id="v1" step="any" placeholder="求解则留空">
      </div>
      <div>
        <label for="c2">C2（目标浓度）</label>
        <input type="number" id="c2" step="any" placeholder="如 50">
      </div>
      <div>
        <label for="v2">V2（目标总体积）</label>
        <input type="number" id="v2" step="any" placeholder="如 10">
      </div>
    </div>
    <button class="btn" id="calcBtn">计算</button>
    <div class="error" id="err"></div>
    <div class="result" id="result"></div>
  </div>
</main>

<footer>
  <span class="foot-note">提示：稀释操作是"取 V1 原液，加溶剂定容至 V2"，而不是"加 (V2−V1) 的溶剂后再看情况"

<script>
'use strict';
function calc() {
  const ids = ['c1', 'v1', 'c2', 'v2'];
  const vals = {};
  let empty = [];
  for (const id of ids) {
    const v = document.getElementById(id).value.trim();
    if (v === '') { empty.push(id); }
    else {
      const n = parseFloat(v);
      if (!isFinite(n)) { err.textContent = '输入中有无法解析的数值'; return; }
      vals[id] = n;
    }
  }
  const err = document.getElementById('err');
  err.textContent = '';
  const out = document.getElementById('result');
  if (empty.length !== 1) {
    err.textContent = empty.length === 0 ? '请留空一个要求解的量' : '请只留空一个量（其余三个必须填写）';
    out.innerHTML = '';
    return;
  }
  const [c1, v1, c2, v2] = ids.map(id => vals[id]);
  const names = { c1: 'C1（原液浓度）', v1: 'V1（所需原液体积）', c2: 'C2（目标浓度）', v2: 'V2（目标总体积）' };
  let solved, extra = '';
  const target = empty[0];
  try {
    if (target === 'v1') { solved = c1 * 0 + (c2 * v2) / c1; }
    else if (target === 'c1') { solved = (c2 * v2) / v1; }
    else if (target === 'c2') { solved = (c1 * v1) / v2; }
    else if (target === 'v2') { solved = (c1 * v1) / c2; }
  } catch (e) { solved = NaN; }
  if (!isFinite(solved)) { err.textContent = '无法求解：请检查是否除以 0'; out.innerHTML = ''; return; }
  if (target === 'v2' && v1 !== undefined && c1 !== undefined && c2 !== undefined && v1 > v2) {
    extra = '<div class="error">注意：求出的 V2 小于 V1，说明不是稀释而是需要浓缩，请核对输入。</div>';
  }
  const rounded = Math.round(solved * 1e6) / 1e6;
  let html = '<div class="big-number"><span>' + rounded + '</span><small>' + target.toUpperCase() + '</small></div>';
  if (target === 'v1') {
    html += '<table class="tbl"><tr><th>操作步骤</th></tr>' +
      '<tr><td>取原液 ' + rounded + ' 份体积，加入溶剂，定容至 ' + v2 + ' 份体积（即补溶剂 ' + (Math.round((v2 - rounded) * 1e6) / 1e6) + '）。</td></tr></table>';
  }
  html += extra;
  out.innerHTML = html;
}
document.getElementById('calcBtn').addEventListener('click', calc);
</script>
</body>
