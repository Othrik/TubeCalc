<main class="container">
  <h1 class="page-title">统计计算器</h1>
  <p class="page-desc">粘贴两组数值（空格 / 逗号 / 换行分隔均可），得到描述统计与 Welch t 检验（不要求方差齐性）。只填一组则仅输出描述统计。</p>

  <div class="panel">
    <div class="row">
      <div>
        <label for="g1">组 1 数据</label>
        <textarea id="g1" rows="5" placeholder="例如：5.1 4.9 5.3 5.0 4.8"></textarea>
      </div>
      <div>
        <label for="g2">组 2 数据（可选）</label>
        <textarea id="g2" rows="5" placeholder="例如：6.2 6.0 6.5 6.1"></textarea>
      </div>
    </div>
    <button class="btn" id="calcBtn">计算</button>
    <div class="error" id="err"></div>
    <div id="result"></div>
  </div>
</main>

<footer>
  <span class="foot-note">标准差为样本标准差 (n−1)；p 值由不完全 Beta 函数精确计算

<script>
'use strict';
function parseNums(text) {
  if (!text.trim()) return [];
  const parts = text.split(/[\s,;，；\n]+/).filter(x => x.length);
  const nums = parts.map(Number);
  if (nums.some(n => !isFinite(n))) throw '存在无法解析的数值，请检查输入';
  return nums;
}
function desc(arr) {
  const n = arr.length;
  const mean = arr.reduce((a, b) => a + b, 0) / n;
  const ss = arr.reduce((a, b) => a + (b - mean) * (b - mean), 0);
  const sd = n > 1 ? Math.sqrt(ss / (n - 1)) : 0;
  return { n, mean, sd, sem: n > 1 ? sd / Math.sqrt(n) : 0 };
}
// 正则化不完全 Beta 函数 I_x(a,b)（Numerical Recipes 实现）
function logGamma(x) {
  const cof = [76.18009172947146, -86.50532032941677, 24.01409824083091,
    -1.231739572450155, 0.1208650973866179e-2, -0.5395239384953e-5];
  let j, y, tmp, ser = 1.000000000190015;
  y = x; tmp = x + 5.5; tmp -= (x + 0.5) * Math.log(tmp);
  for (j = 0; j < 6; j++) ser += cof[j] / ++y;
  return -tmp + Math.log(2.5066282746310005 * ser / x);
}
function betacf(a, b, x) {
  const MAXIT = 200, EPS = 3e-12, FPMIN = 1e-300;
  let qab = a + b, qap = a + 1, qam = a - 1, c = 1, d = 1 - qab * x / qap;
  if (Math.abs(d) < FPMIN) d = FPMIN;
  d = 1 / d; let h = d;
  for (let m = 1; m <= MAXIT; m++) {
    const m2 = 2 * m;
    let aa = m * (b - m) * x / ((qam + m2) * (a + m2));
    d = 1 + aa * d; if (Math.abs(d) < FPMIN) d = FPMIN;
    c = 1 + aa / c; if (Math.abs(c) < FPMIN) c = FPMIN;
    d = 1 / d; h *= d * c;
    aa = -(a + m) * (qab + m) * x / ((a + m2) * (qap + m2));
    d = 1 + aa * d; if (Math.abs(d) < FPMIN) d = FPMIN;
    c = 1 + aa / c; if (Math.abs(c) < FPMIN) c = FPMIN;
    d = 1 / d; const del = d * c; h *= del;
    if (Math.abs(del - 1) < EPS) break;
  }
  return h;
}
function betai(a, b, x) {
  if (x <= 0) return 0;
  if (x >= 1) return 1;
  const bt = Math.exp(logGamma(a + b) - logGamma(a) - logGamma(b) + a * Math.log(x) + b * Math.log(1 - x));
  return x < (a + 1) / (a + b + 2) ? bt * betacf(a, b, x) / a : 1 - bt * betacf(b, a, 1 - x) / b;
}
function tTestTwoTailedP(t, df) {
  return betai(df / 2, 0.5, df / (df + t * t));
}
function welch(a, b) {
  const A = desc(a), B = desc(b);
  const v1 = A.sd * A.sd / A.n, v2 = B.sd * B.sd / B.n;
  const t = (A.mean - B.mean) / Math.sqrt(v1 + v2);
  const df = (v1 + v2) * (v1 + v2) /
    ((v1 * v1) / (A.n - 1) + (v2 * v2) / (B.n - 1));
  return { A, B, t, df, p: tTestTwoTailedP(t, df) };
}
function fmt(x, d) {
  if (!isFinite(x)) return '—';
  const ax = Math.abs(x);
  if (ax !== 0 && (ax < 1e-4 || ax >= 1e6)) return x.toExponential(4);
  return Number(x).toFixed(d === undefined ? 4 : d);
}
function pStars(p) {
  if (p < 0.001) return '***';
  if (p < 0.01) return '**';
  if (p < 0.05) return '*';
  return 'ns';
}

function render() {
  const err = document.getElementById('err');
  err.textContent = '';
  let a, b;
  try {
    a = parseNums(document.getElementById('g1').value);
    b = parseNums(document.getElementById('g2').value);
  } catch (e) { err.textContent = String(e); return; }
  if (a.length < 2) { err.textContent = '组 1 至少需要 2 个数值'; return; }
  const out = document.getElementById('result');
  let html = '<table class="tbl"><tr><th>指标</th><th>组 1</th>' + (b.length ? '<th>组 2</th>' : '') + '</tr>';
  const A = desc(a), B = b.length >= 2 ? desc(b) : null;
  html += '<tr><td>n</td><td>' + A.n + '</td>' + (B ? '<td>' + B.n + '</td>' : '') + '</tr>';
  html += '<tr><td>均值</td><td>' + fmt(A.mean) + '</td>' + (B ? '<td>' + fmt(B.mean) + '</td>' : '') + '</tr>';
  html += '<tr><td>标准差 SD</td><td>' + fmt(A.sd) + '</td>' + (B ? '<td>' + fmt(B.sd) + '</td>' : '') + '</tr>';
  html += '<tr><td>标准误 SEM</td><td>' + fmt(A.sem) + '</td>' + (B ? '<td>' + fmt(B.sem) + '</td>' : '') + '</tr>';
  html += '</table>';
  if (B && b.length >= 2) {
    if (a.length < 2 || b.length < 2) { /* 不会到达 */ }
    const r = welch(a, b);
    html += '<div class="result"><label>Welch t 检验（双尾）</label>' +
      '<table class="tbl">' +
      '<tr><th>t 值</th><th>自由度 df</th><th>双尾 p 值</th><th>显著性</th></tr>' +
      '<tr><td>' + fmt(r.t) + '</td><td>' + fmt(r.df, 2) + '</td><td>' + fmt(r.p) + '</td><td>' + pStars(r.p) + '</td></tr>' +
      '</table><div class="hint">均值差 = ' + fmt(A.mean - B.mean) + '；p &lt; 0.05 通常认为差异显著（* p&lt;0.05，** p&lt;0.01，*** p&lt;0.001）。</div></div>';
  } else if (b.length === 1) {
    html += '<div class="error">组 2 只有 1 个数值，无法参与检验</div>';
  }
  out.innerHTML = html;
}
document.getElementById('calcBtn').addEventListener('click', render);
</script>
