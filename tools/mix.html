<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配方计算器 · TubeCalc</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230a84ff%27/%3E%3Ctext x=%2716%27 y=%2724%27 font-size=%2719%27 text-anchor=%27middle%27%3E%F0%9F%A7%AA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/style.css">
<style>
.mix-controls { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; margin:14px 0 6px; }
.mix-controls label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted); }
.mix-total { display:flex; gap:8px; }
.mix-row { display:grid; grid-template-columns: minmax(120px,1.2fr) 1.4fr 1.4fr .9fr 44px; gap:10px; align-items:center;
  padding:10px 12px; border:1px solid var(--border); border-radius:11px; margin-top:10px; background:var(--card); }
.mix-row.water { background:var(--accent-soft); border-color:var(--accent); }
.mix-head { font-size:12.5px; color:var(--muted); display:grid; grid-template-columns: minmax(120px,1.2fr) 1.4fr 1.4fr .9fr 44px; gap:10px; padding:0 12px; margin-top:18px; }
.cell { display:flex; gap:6px; align-items:center; min-width:0; }
.cell input[type=text], .cell input[type=number], .cell select { min-width:0; flex:1; }
.vol-out { font-weight:600; font-variant-numeric:tabular-nums; }
.row-warn { color:var(--danger); font-size:12px; grid-column:1/-1; }
.del { border:1px solid var(--border); background:var(--card); color:var(--muted); border-radius:8px; cursor:pointer; height:38px; }
.del:hover { color:var(--danger); border-color:var(--danger); }
@media (max-width:760px){ .mix-head{display:none;} .mix-row{grid-template-columns:1fr 1fr;} .mix-row .cell.name{grid-column:1/3;} .mix-row .del{grid-column:2; justify-self:end;} .mix-row .row-warn{grid-column:1/3;} }
#mixWarn { margin-top:14px; }
.btn-ghost { background:transparent; border:1px solid var(--border); color:var(--text); }
</style>
</head>
<body>
<nav class="nav"><div class="nav-inner">
  <a class="brand" href="../index.html">TubeCalc<span> · 科研小工具</span></a>
  <div class="nav-links">
    <a href="../index.html">首页</a>
    <a href="mw.html">分子量</a>
    <a href="seq.html">序列工具</a>
    <a href="stats.html">统计计算</a>
    <a href="dilution.html">稀释计算</a>
    <a href="unit.html">单位换算</a>
    <a href="mix.html" class="active">配方计算</a>
  </div>
</div></nav>

<main class="container">
  <h1 class="page-title">配方计算器</h1>
  <p class="page-desc">反应体系 / 母液配制：按"储液浓度 → 终浓度"自动算加样量（V = C终 × V总 ÷ C储），溶剂自动补齐，数据自动保存在本浏览器。</p>

  <div class="mix-controls">
    <label>总体积
      <span class="mix-total"><input type="number" id="total" value="200" min="0" step="any" style="width:110px">
      <select id="totalUnit" style="width:74px"><option value="1">μL</option><option value="1000">mL</option></select></span>
    </label>
    <button class="btn" id="addRow">添加组分</button>
    <button class="btn btn-ghost" id="loadDemo">载入示例配方</button>
    <button class="btn btn-ghost" id="copyTsv">复制表格 (TSV)</button>
  </div>

  <div class="mix-head"><span>组分</span><span>储液浓度</span><span>终浓度</span><span>加样量</span><span></span></div>
  <div id="waterRow"></div>
  <div id="rows"></div>
  <div class="error" id="mixWarn"></div>
  <div class="hint" style="margin-top:12px">「自动计算」行按 V=C终×V总÷C储 计算；「手动指定」行直接填体积（若同时填储液浓度会反显终浓度）；水的加样量 = 总体积 − 各组分之和。</div>
</main>

<footer><span class="foot-note">计算全部在浏览器本地进行</span><br>© 2026 <a href="../index.html">TubeCalc</a> · <a href="https://github.com/Othrik/TubeCalc" target="_blank" rel="noopener"><svg viewBox="0 0 16 16" width="15" height="15" fill="currentColor" style="vertical-align:-2px;margin-right:4px" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>GitHub</a></footer>

<script>
const LS_KEY = 'tubecalc_mix_v1';
const $ = (s, p) => (p || document).querySelector(s);
const UNITS = [['1','M'], ['0.001','mM'], ['0.000001','μM'], ['1e-9','nM']];
let rows = [];

function fmtVol(v) {
  if (!isFinite(v)) return '—';
  const a = Math.abs(v);
  return (a >= 100 ? v.toFixed(1) : a >= 1 ? v.toFixed(2) : v.toFixed(3));
}
function fmtConc(v) {
  const a = Math.abs(v);
  return (a >= 100 ? v.toFixed(1) : a >= 1 ? v.toFixed(2) : a >= 0.001 ? v.toFixed(4) : v.toExponential(2));
}
function totalUpt() { return (parseFloat($('#total').value) || 0) * parseFloat($('#totalUnit').value); }

function demo() {
  return { total: 200, totalUnit: '1', rows: [
    { name:'Tris-HCl pH 8.0', type:'calc', sv:1,   su:'1',      fv:75,  fu:'0.001', vol:0 },
    { name:'NaCl',            type:'calc', sv:5,   su:'1',      fv:75,  fu:'0.001', vol:0 },
    { name:'TCEP',            type:'calc', sv:120, su:'0.001',  fv:1.2, fu:'0.001', vol:0 },
    { name:'TMR-LPETG',       type:'calc', sv:1,   su:'0.001',  fv:10,  fu:'0.000001', vol:0 },
    { name:'Cargo（GGA-PSP）', type:'calc', sv:144.1, su:'1e-9', fv:2.5, fu:'1e-9',  vol:0 },
    { name:'SortaseA（SRT7plus）', type:'calc', sv:265.2, su:'1e-9', fv:0.5, fu:'1e-9', vol:0 },
    { name:'superTEV',        type:'calc', sv:24.9, su:'1e-9',  fv:1,   fu:'1e-9',  vol:0 },
    { name:'QtEnc',           type:'fixed', sv:'', su:'1',      fv:'',  fu:'1',     vol:0 }
  ]};
}

function unitSel(sel, cls) {
  return '<select class="' + cls + '">' + UNITS.map(u =>
    '<option value="' + u[0] + '"' + (u[0] === sel ? ' selected' : '') + '>' + u[1] + '</option>').join('') + '</select>';
}

function render() {
  $('#waterRow').innerHTML = '<div class="mix-row water"><div class="cell name"><input type="text" value="水（溶剂）" disabled></div>' +
    '<div class="cell">—</div><div class="cell">—</div><div class="cell"><span class="vol-out" id="waterVol">—</span></div><div></div></div>';
  const box = $('#rows'); box.innerHTML = '';
  rows.forEach((r, i) => {
    const d = document.createElement('div');
    d.className = 'mix-row';
    d.innerHTML =
      '<div class="cell name"><input type="text" data-k="name" placeholder="组分名" value="' + (r.name || '').replace(/"/g, '&quot;') + '"></div>' +
      '<div class="cell"><input type="number" data-k="sv" placeholder="储液浓度" min="0" step="any" value="' + r.sv + '">' + unitSel(r.su, 'su') + '</div>' +
      (r.type === 'calc'
        ? '<div class="cell"><input type="number" data-k="fv" placeholder="终浓度" min="0" step="any" value="' + r.fv + '">' + unitSel(r.fu, 'fu') + '</div>'
        : '<div class="cell"><span class="hint" style="flex:1">体积手动指定</span></div>') +
      (r.type === 'calc'
        ? '<div class="cell"><span class="vol-out" data-vol>—</span></div>'
        : '<div class="cell vol-fixed"><input type="number" data-k="vol" placeholder="μL" min="0" step="any" value="' + (r.vol || '') + '"></div>') +
      '<button class="del" data-del title="删除该组分">×</button>' +
      (r.type === 'fixed' && r.sv !== '' ? '<div class="hint" data-inv style="grid-column:1/-1"></div>' : '');
    d.querySelectorAll('[data-k]').forEach(el => el.addEventListener('input', () => {
      r[el.dataset.k] = el.value; changed();
    }));
    d.querySelectorAll('select').forEach(el => el.addEventListener('change', () => {
      if (el.classList.contains('su')) r.su = el.value; else r.fu = el.value; changed();
    }));
    $('[data-del]', d).addEventListener('click', () => { rows.splice(i, 1); render(); });
    box.appendChild(d);
  });
  changed();
}

function changed() { updateOutputs(); persist(); }

function updateOutputs() {
  const vt = totalUpt();
  let sum = 0;
  document.querySelectorAll('#rows .mix-row').forEach((d, i) => {
    const r = rows[i];
    let v = 0, warn = '';
    if (r.type === 'calc') {
      const cs = parseFloat(r.sv) * parseFloat(r.su);
      const cf = parseFloat(r.fv) * parseFloat(r.fu);
      v = (cs > 0 && isFinite(cf)) ? cf * vt / cs : NaN;
      if (isFinite(v)) {
        sum += v;
        if (cf > cs) warn = '终浓度高于储液浓度，无法配制';
        $('[data-vol]', d).textContent = fmtVol(v) + ' μL';
      } else { $('[data-vol]', d).textContent = '—'; }
    } else {
      v = parseFloat(r.vol) || 0; sum += v;
      const cs = parseFloat(r.sv) * parseFloat(r.su);
      const inv = $('[data-inv]', d);
      if (inv) inv.textContent = (cs > 0 && vt > 0) ? '按当前储液折算终浓度 ≈ ' + fmtConc(cs * v / vt) + ' M' : '';
    }
    r._v = isFinite(v) ? v : 0;
    let w = $('.row-warn', d);
    if (warn && !w) { w = document.createElement('div'); w.className = 'row-warn'; d.appendChild(w); }
    if (w) w.textContent = warn;
  });
  const water = vt - sum;
  const wv = $('#waterVol');
  wv.textContent = water >= 0 ? fmtVol(water) + ' μL' : '—';
  wv.style.color = water < 0 ? 'var(--danger)' : '';
  $('#mixWarn').textContent = water < 0 ? ('溶剂为负：组分总体积已达 ' + fmtVol(sum) + ' μL，超过总体系 ' + fmtVol(vt) + ' μL，请调整') : '';
  persist();
}

function persist() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({ total: $('#total').value, totalUnit: $('#totalUnit').value, rows: rows })); } catch (e) {}
}
function restore() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY));
    if (s && Array.isArray(s.rows)) {
      $('#total').value = s.total; $('#totalUnit').value = s.totalUnit;
      rows = s.rows.map(r => Object.assign({ name:'', type:'calc', sv:'', su:'1', fv:'', fu:'1', vol:'' }, r));
      return true;
    }
  } catch (e) {}
  return false;
}

$('#total').addEventListener('input', changed);
$('#totalUnit').addEventListener('change', changed);
$('#addRow').addEventListener('click', () => { rows.push({ name:'', type:'calc', sv:'', su:'1', fv:'', fu:'1', vol:'' }); render(); });
$('#loadDemo').addEventListener('click', () => { const d = demo(); $('#total').value = d.total; $('#totalUnit').value = d.totalUnit; rows = d.rows; render(); });
$('#copyTsv').addEventListener('click', function () {
  const vt = totalUpt();
  const UL = {'1':' M','0.001':' mM','0.000001':' μM','1e-9':' nM'};
  let out = '组分\t储液浓度\t终浓度\t加样量\n水（溶剂）\t—\t—\t' + $('#waterVol').textContent + '\n';
  rows.forEach(r => {
    const cs = (r.sv === '' || r.sv == null) ? '—' : r.sv + UL[r.su];
    const cf = (r.type === 'calc' && r.fv !== '' && r.fv != null) ? r.fv + UL[r.fu]
             : (r.type === 'fixed' && r.sv !== '' && r.sv != null ? '≈' + fmtConc(parseFloat(r.sv) * parseFloat(r.su) * r._v / vt) + ' M' : '—');
    out += [r.name || '未命名', cs, cf, r.type === 'calc' ? fmtVol(r._v) + ' μL' : (r.vol || 0) + ' μL'].join('\t') + '\n';
  });
  const btn = $('#copyTsv'), t = btn.textContent;
  const done = () => { btn.textContent = '已复制'; setTimeout(() => btn.textContent = t, 1200); };
  (navigator.clipboard ? navigator.clipboard.writeText(out) : Promise.reject()).catch(() => {
    const ta = document.createElement('textarea'); ta.value = out; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  }).finally(done);
});

if (!restore()) rows = [{ name:'', type:'calc', sv:'', su:'1', fv:'', fu:'1', vol:'' }];
render();
</script>
</body>
</html>
